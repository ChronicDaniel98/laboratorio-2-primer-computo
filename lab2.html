<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acerca de Mí</title>
    <link rel="stylesheet" href="styles.css"> 
</head>
<body>

    <h1>Acerca de Mí</h1>
    
    <div class="grid-container">
        <div class="box" id="hobby">
            <img src="https://s1.eestatic.com/2023/04/14/omicrono/software/756184496_232407350_1706x960.jpg" alt="Hobby">
            <p>Hobby favorito es jugar videosjuegos</p>
        </div>
        <div class="box" id="comida">
            <img src="https://www.annarecetasfaciles.com/files/miniatura-55-scaled.jpg" alt="Comida">
            <p>Comida favorita es lasaña</p>
        </div>
        <div class="box" id="pelicula">
            <img src="https://images5.alphacoders.com/111/thumb-1920-1111276.jpg" alt="Película">
            <p>Película o serie favorita es breaking bad</p>
        </div>
        <div class="box" id="color">
            <img src="https://png.pngtree.com/thumb_back/fh260/background/20210207/pngtree-gray-background-pure-color-simple-image_557025.jpg" alt="Color">
            <p>Color favorito es gris</p>
        </div>
        <div class="box" id="artista">
            <img src="https://forbes.com.br/wp-content/uploads/2022/12/carreira_lionel_messi.jpg" alt="Artista">
            <p>Artista o deportista favorito es Messi</p>
            <input type="text" placeholder="Escribe aquí..." id="artistaInput">
        </div>
        <div class="box" id="pais">
            <img src="https://www.recordrentacar.com/blog/wp-content/uploads/2023/11/atenas-monumentos-acropolis.jpg" alt="País">
            <p>Un país que me gustaría visitar seria grecia</p>
        </div>
       
    </div>
    <script src="lab222.js"></script>
   
</body>
</html>
